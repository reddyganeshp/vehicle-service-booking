<!doctype html>
<html>
<head>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <title>All Bookings</title>
</head>
<body>
  <h2>All Bookings</h2>

  {% if bookings|length == 0 %}
    <p>No bookings yet!</p>
  {% else %}
    <ul>
      {% for b in bookings %}
        <li>
          {{ b.name }} - {{ b.vehicle_number }}
          <a href="/booking/update/{{ b.id }}">Update</a>
          <a href="/booking/delete/{{ b.id }}">Delete</a>
          <a href="/booking/pdf/{{ b.id }}">Download PDF</a>
        </li>
      {% endfor %}
    </ul>
  {% endif %}

  <br>
  <a href="/booking/create">Create new booking</a><br>
  <a href="/">Back to Home page</a>
</body>
</html>
